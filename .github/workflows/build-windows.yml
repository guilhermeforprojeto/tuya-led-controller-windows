name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'requirements.txt', 'tests/**', '.github/workflows/build-windows.yml']
  pull_request:
    paths: ['*.py', 'requirements.txt', 'tests/**', '.github/workflows/build-windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run mocked tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ControleLED --hidden-import pystray._win32 controle_led.py
      - uses: actions/upload-artifact@v4
        with:
          name: ControleLED-Windows
          path: dist/ControleLED.exe
          if-no-files-found: error
